name: MultiChat Event Contract

on:
  pull_request:
    branches: [main]
    paths:
      - run_multichat.py
      - multichat_journal.py
      - tests/test_multichat_event_contract.py
      - tests/test_multichat_safety.py
      - docs/EVENT_JOURNAL_AND_TASK_CORRELATION.md
      - .github/workflows/multichat-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multichat-event-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused runtime/test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn requests pydantic pytest httpx psutil
      - name: Compile MultiChat runtime
        run: python -m compileall -q run_multichat.py multichat_journal.py
      - name: Run event/task contract regressions
        run: python -m pytest -q tests/test_multichat_event_contract.py tests/test_multichat_safety.py